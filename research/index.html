<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Dadan in Depth</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: a playful letter-board. Big number tiles that open in place; three "why" tiles; a slider; questions that open. Light only, by the owner's choice. */
:root{--bg:#F2FAF8;--paper:#FFFFFF;--ink:#17324A;--ink2:#56697D;--line:#D5E6E2;
--teal:#0C8F8B;--teal-t:#DDF5F1;--pink:#D2456C;--pink-t:#FDE6EC;--purple:#7250BE;--purple-t:#ECE4FA;--yellow:#9A6A00;--yellow-t:#FFF0C4;--green:#3F8A1F;--orange:#E8662E;
--display:'Baloo Bhaijaan 2','IBM Plex Sans Arabic',system-ui,sans-serif;--body:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',sans-serif}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;
padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px;overflow-x:hidden}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:44px;position:relative}
.deco{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.deco span{position:absolute;font-family:var(--display);font-weight:800;line-height:1;opacity:.16}
.wrap>*:not(.deco){position:relative;z-index:1}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:20px}
header.top img{height:64px;width:auto}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
.lang{font-family:var(--display);font-weight:700;font-size:17px;background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:6px 18px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.lang:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
:focus-visible{outline:3px solid var(--purple);outline-offset:3px}
.hero{display:flex;flex-direction:column;gap:10px;max-width:720px}
.kicker{font-family:var(--display);font-weight:800;font-size:18px;color:var(--teal)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(32px,6vw,54px);line-height:1.12;margin:0;text-wrap:balance}
h1 em{font-style:normal;background:linear-gradient(transparent 62%,var(--yellow-t) 62%)}
.lead{color:var(--ink2);font-size:19px;margin:0;max-width:60ch}
section{display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--display);font-weight:800;font-size:30px;margin:0;display:flex;align-items:center;gap:12px}
h2::before{content:attr(data-l);font-size:26px;width:46px;height:46px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;background:var(--hc,var(--teal-t));color:var(--hk,var(--teal));transform:rotate(-6deg);flex:none}
.sub{color:var(--ink2);margin:0;max-width:62ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:16px;align-items:start}
.tile{background:var(--paper);border:2px solid var(--ink);border-radius:22px;box-shadow:5px 5px 0 var(--k);overflow:hidden;min-width:0}
.tile.teal{--k:var(--teal);--t:var(--teal-t)}.tile.pink{--k:var(--pink);--t:var(--pink-t)}.tile.purple{--k:var(--purple);--t:var(--purple-t)}.tile.yellow{--k:var(--yellow);--t:var(--yellow-t)}
.tile>button{display:flex;flex-direction:column;gap:6px;width:100%;text-align:start;background:none;border:0;padding:18px 20px 16px;cursor:pointer}
.big{font-family:var(--display);font-weight:800;font-size:46px;line-height:1.1;color:var(--k);unicode-bidi:plaintext;font-variant-numeric:tabular-nums}
[dir=rtl] .big{text-align:right}
.claim{font-size:16.5px;line-height:1.5}
.more{align-self:flex-start;margin-top:6px;font-family:var(--display);font-weight:700;font-size:15px;background:var(--t);color:var(--k);border-radius:999px;padding:3px 14px}
.tile[data-open="1"] .more{background:var(--k);color:#fff}
.back{background:var(--t);padding:16px 20px 18px;border-top:2px dashed var(--k);display:flex;flex-direction:column;gap:10px;font-size:15.5px}
.back dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px}
.back dt{font-weight:600;color:var(--k);white-space:nowrap}.back dd{margin:0;min-width:0}
.found{margin:0;background:var(--paper);border-radius:12px;padding:10px 12px}
.found b,.note b{display:block;font-family:var(--display);color:var(--k)}
.note{margin:0;font-size:15px}
.back a{color:var(--ink);font-weight:600;overflow-wrap:anywhere}
.why .tile>button{flex-direction:row;align-items:center;gap:14px}
.ico{width:64px;height:64px;border-radius:18px;background:var(--t);display:flex;align-items:center;justify-content:center;flex:none}.ico img{width:48px;height:48px;object-fit:contain}
.why h3{font-family:var(--display);font-weight:800;font-size:21px;margin:0;line-height:1.25}
.why .dadan{margin:0;font-size:15.5px;color:var(--ink2)}
.txt{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.math{background:var(--paper);border:2px solid var(--ink);border-radius:22px;box-shadow:5px 5px 0 var(--orange);padding:22px;display:flex;flex-direction:column;gap:18px}
.math input[type=range]{width:100%;accent-color:var(--orange);height:28px}
.presets{display:flex;flex-wrap:wrap;gap:8px}
.presets button{font-family:var(--display);font-weight:700;font-size:16px;border:2px solid var(--ink);background:var(--paper);border-radius:999px;padding:5px 16px;cursor:pointer}
.presets button[aria-pressed=true]{background:var(--ink);color:#fff}
.ins{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px 26px}
.in{display:flex;flex-direction:column;gap:2px;min-width:0}
.in label{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:15.5px}
.in label b{font-family:var(--display);font-weight:800;font-size:20px;white-space:nowrap;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.verdict{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.5;border-radius:14px;padding:10px 16px;margin:0}
.verdict.bad{background:var(--pink-t);color:var(--pink)}.verdict.mid{background:var(--yellow-t);color:var(--yellow)}.verdict.good{background:var(--teal-t);color:var(--teal)}
.o4{background:var(--yellow-t)}.o4 b{color:var(--yellow)}
.out small{font-size:13.5px;color:var(--ink2)}
.small a{color:var(--ink);font-weight:600}
.outs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.out{border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.out b{font-family:var(--display);font-weight:800;font-size:34px;line-height:1.1;direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
[dir=rtl] .out b{text-align:right}
.out span{font-size:15px;color:var(--ink2)}
.o1{background:var(--teal-t)}.o1 b{color:var(--teal)}.o2{background:var(--purple-t)}.o2 b{color:var(--purple)}.o3{background:var(--pink-t)}.o3 b{color:var(--pink)}
.small{color:var(--ink2);font-size:15px;margin:0}
.faq{display:flex;flex-direction:column;gap:10px}
.qa{background:var(--paper);border:2px solid var(--ink);border-radius:18px;overflow:hidden}
.qa>button{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:start;background:none;border:0;padding:14px 18px;cursor:pointer;font-family:var(--display);font-weight:700;font-size:19px;line-height:1.3}
.qa>button::after{content:"+";font-size:26px;line-height:1;width:34px;height:34px;border-radius:50%;background:var(--purple-t);color:var(--purple);display:flex;align-items:center;justify-content:center;flex:none;transition:transform .2s}
.qa[data-open="1"]>button::after{transform:rotate(45deg);background:var(--purple);color:#fff}
.qa ul{margin:0;padding:0 18px 16px;padding-inline-start:40px;display:flex;flex-direction:column;gap:6px}
.qa li::marker{color:var(--purple)}
.limits{background:var(--yellow-t);border:2px dashed var(--yellow);border-radius:22px;padding:18px 22px}
.limits ul{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:6px}
footer{color:var(--ink2);font-size:14.5px;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:520px){.big{font-size:40px}h2{font-size:25px}header.top img{height:52px}}
</style>

var D={"nums": [{"c": "pink", "big": "49.7%", "en": {"claim": "of parents in a Gulf study reported behaviour problems their child picked up from YouTube", "who": "Nadia Qurban, PhD thesis, University of Sheffield", "where": "Saudi Arabia (2,594 parents) and Saudi families in the UK (219)", "when": "2022", "sample": "2,813 parents of children aged 3 to 6, online survey, plus 9 home case studies", "found": "About half reported behaviour concerns, such as children copying vloggers who shout, speak rudely or break toys. 87% said YouTube carries a risk for children.", "note": "One country and one thesis. We use it because it is the largest study we found of this age group in the Gulf."}, "ar": {"claim": "من الأهل في دراسة خليجية قالوا إن طفلهم أخذ سلوكيات سيئة من يوتيوب", "who": "نادية قربان، رسالة دكتوراه، جامعة شيفيلد", "where": "السعودية (2,594 ولي أمر) وعائلات سعودية في بريطانيا (219)", "when": "2022", "sample": "2,813 ولي أمر لأطفال من 3 إلى 6 سنوات، استبيان إلكتروني، مع 9 زيارات منزلية", "found": "حوالي النص ذكروا مشاكل في السلوك، مثل تقليد اليوتيوبرز في الصراخ والكلام غير المؤدب وتكسير الألعاب. و87% قالوا إن يوتيوب فيه خطر على الأطفال.", "note": "دراسة وحدة في بلد واحد. نستخدمها لأنها أكبر دراسة لقيناها عن هذا العمر في الخليج."}, "url": "https://etheses.whiterose.ac.uk/32779/1/SAUDI%20CHILDREN%27S%20USE%20OF%20YOUTUBE%20AND%20THE%20ROLE%20OF%20FAMILY%203.4.2023.pdf"}, {"c": "teal", "big": "6 in 10", "bigAr": "6 من 10", "en": {"claim": "children in the Middle East and North Africa cannot read and understand a simple text by age 10", "who": "World Bank", "where": "Middle East and North Africa", "when": "February 2020", "sample": "Regional \"learning poverty\" indicator, built from national test results", "found": "59% of 10-year-olds in the region are \"learning poor\": they cannot read and understand a simple text.", "note": "This is a regional average, not a figure for Qatar. It is from before COVID; later World Bank estimates are higher."}, "ar": {"claim": "أطفال في الشرق الأوسط وشمال أفريقيا ما يقدرون يقرون ويفهمون نص بسيط في عمر 10", "who": "البنك الدولي", "where": "الشرق الأوسط وشمال أفريقيا", "when": "فبراير 2020", "sample": "مؤشر «فقر التعلّم» للمنطقة، مبني على نتائج الاختبارات الوطنية", "found": "59% من الأطفال في عمر 10 سنوات في المنطقة ما يقدرون يقرون ويفهمون نص بسيط.", "note": "هذا متوسط المنطقة كلها، مب رقم قطر. وهو من قبل كورونا، والتقديرات الأحدث أعلى."}, "url": "https://www.worldbank.org/en/news/press-release/2020/02/17/countries-commit-to-tackling-learning-poverty-and-accelerating-learning-in-middle-east-and-africa"}, {"c": "purple", "big": "58%", "en": {"claim": "of popular \"educational\" apps for young children scored low on learning quality", "who": "Meyer and colleagues, University of Michigan, with Penn State, Temple, Delaware and Common Sense Media", "where": "United States, Google Play and App Store", "when": "2021", "sample": "124 apps: the top 100 \"educational\" apps for children plus 24 apps most used by a group of preschoolers", "found": "72 of the 124 apps (58%) scored 4 or less out of 12 on four tests of good learning design.", "note": "The apps were English-language store apps. We did not find a similar scored review of Arabic apps."}, "ar": {"claim": "من التطبيقات «التعليمية» المشهورة للأطفال الصغار جودتها التعليمية ضعيفة", "who": "Meyer وفريقها، جامعة ميشيغان، مع Penn State وTemple وDelaware وCommon Sense Media", "where": "أمريكا، Google Play وApp Store", "when": "2021", "sample": "124 تطبيق: أشهر 100 تطبيق «تعليمي» للأطفال، و24 تطبيق يستخدمها أطفال روضة", "found": "72 تطبيق من 124 (58%) أخذوا 4 أو أقل من 12 في أربعة مقاييس للتصميم التعليمي الجيد.", "note": "التطبيقات كانت بالإنجليزي. ما لقينا مراجعة مشابهة بدرجات للتطبيقات العربية."}, "url": "https://doi.org/10.1080/17482798.2021.1882516"}, {"c": "yellow", "big": "1 h", "en": {"claim": "is the most screen time a day the WHO advises for children aged 2 to 4", "who": "World Health Organization", "where": "Global guideline", "when": "April 2019", "sample": "Guideline on physical activity, sitting time and sleep for children under 5", "found": "For ages 2 to 4, sitting screen time \"should be no more than 1 hour; less is better\".", "note": "The guideline covers children under 5 and is about time spent sitting at a screen."}, "ar": {"claim": "أقصى وقت شاشة باليوم تنصح فيه منظمة الصحة العالمية للأطفال من 2 إلى 4 سنوات", "who": "منظمة الصحة العالمية", "where": "إرشاد عالمي", "when": "أبريل 2019", "sample": "إرشادات النشاط البدني والجلوس والنوم للأطفال تحت 5 سنوات", "found": "للأطفال من 2 إلى 4 سنوات: وقت الجلوس قدام الشاشة ما يزيد عن ساعة باليوم، والأقل أحسن.", "note": "الإرشاد يخص الأطفال تحت 5 سنوات، ويتكلم عن وقت الجلوس قدام الشاشة."}, "url": "https://www.who.int/publications/i/item/9789241550536"}, {"c": "teal", "big": "82%", "en": {"claim": "of parents in an Abu Dhabi survey set rules on which apps their child may use", "who": "Abu Dhabi Early Childhood Authority with NYU Abu Dhabi", "where": "United Arab Emirates", "when": "2025", "sample": "More than 10,000 UAE residents, focused on parents of children up to age 8", "found": "82% set rules on which apps and platforms the child may use; 71% set time limits. Parents ranked early learning and Arabic-language videos highest among content choices.", "note": "Described as a preliminary study; we read the figures in press reports of the survey."}, "ar": {"claim": "من الأهل في استبيان أبوظبي يحطون قواعد على التطبيقات اللي يستخدمها طفلهم", "who": "هيئة أبوظبي للطفولة المبكرة مع جامعة نيويورك أبوظبي", "where": "الإمارات", "when": "2025", "sample": "أكثر من 10,000 شخص في الإمارات، والتركيز على أهل الأطفال لين عمر 8", "found": "82% يحطون قواعد على التطبيقات والمنصات، و71% يحددون الوقت. والأهل حطوا التعلّم المبكر والفيديوهات العربية في أول اختياراتهم.", "note": "الدراسة موصوفة بأنها أولية، وقرينا أرقامها من الأخبار اللي نشرت عنها."}, "url": "", "src": {"en": "Reported by Aletihad newspaper, April 2025", "ar": "نشرتها جريدة الاتحاد، أبريل 2025"}}, {"c": "purple", " شنو الفرق بينه وبين تطبيقات الحروف العربية الثانية؟", ["الأم أو الأب يسمع ويصحّح، فهو جزء من التعلّم.", "القيم والعبادات اليومية جزء من يوم الطفل في اللعبة.", "شفنا الصفحات العامة لخمس تطبيقات حروف عربية في نوفمبر 2026 وما لقينا هالشيئين. «ما لقينا» يعني ما شفناه في صفحاتهم العامة."]]}, {"en": ["Is this more screen time?", ["Children are already on screens. We want that time to teach reading.", "Dadan is played with a parent, not alone: the parent listens to every letter.", "The WHO advises no more than one hour a day for ages 2 to 4, and less is better. We agree."]], "ar": ["هل هذا يزيد وقت الشاشة؟", ["الأطفال أصلاً على الشاشات. نبي هالوقت يعلّمهم القراءة.", "دَدَن ينلعب مع الأم أو الأب، مب بروحه: يسمعون كل حرف.", "منظمة الصحة العالمية تنصح بساعة باليوم كحد أقصى من 2 إلى 4 سنوات، والأقل أحسن. واحنا نوافق."]]}, {"en": ["Which Arabic do the characters speak?", ["Clear Fusha (Modern Standard Arabic), so it works in every Gulf country."]], "ar": ["أي عربية تتكلم الشخصيات؟", ["فصحى واضحة، عشان تناسب كل دول الخليج."]]}, {"en": ["Is it safe for children?", ["No ads.", "Items in the game are earned by reading.", "The child's data stays on the device."]], "ar": ["هل هو آمن للأطفال؟", ["بدون إعلانات.", "الأغراض في اللعبة ياخذها الطفل بالقراءة.", "بيانات الطفل تبقى على الجهاز."]]}, {"en": ["How much does it cost?", ["The letters map is free.", "The full game is planned at $8 a month, with a 7-day free trial.", "A typical education app costs $9.99 a month (RevenueCat 2026)."]], "ar": ["كم سعره؟", ["خريطة الحروف مجاناً.", "اللعبة الكاملة مخطط لها 8 دولار بالشهر، مع تجربة مجانية 7 أيام.", "التطبيق التعليمي المعتاد سعره 9.99 دولار بالشهر (RevenueCat 2026)."]]}, {"en": ["Where is Dadan today?", ["The app works: 28 letters, more than ten games each, eight heroes and two letter songs.", "It has been tested at home with the founder's children.", "On Instagram: 5,134 followers and about 35,000 views in 30 days (@dadaan_kids, November 2026).", "We are at idea stage, with no revenue yet."]], "ar": ["وين وصل دَدَن اليوم؟", ["التطبيق شغّال: 28 حرف، وأكثر من عشر ألعاب لكل حرف، وثمانية أبطال وأغنيتين للحروف.", "تجرّب في البيت مع عيال المؤسِّسة.", "على إنستقرام: 5,134 متابع، وحوالي 35 ألف مشاهدة في 30 يوم (@dadaan_kids، نوفمبر 2026).", "احنا في مرحلة الفكرة، وما عندنا دخل للحين."]]}, {"en": ["What comes next?", ["A web-app pilot with Gulf families.", "Then the App Store, for iPhone and iPad.", "Then international schools in Qatar. We are reaching out to schools now."]], "ar": ["شنو الخطوة الجاية؟", ["تجربة ويب آب مع عائلات في الخليج.", "بعدها آبل ستور، للآيفون والآيباد.", "بعدها المدارس الدولية في قطر. قاعدين نتواصل مع المدارس الحين."]]}, {"en": ["Who is behind it?", ["Shaikha Al-Ansari: founder, leads the product.", "Lina Elsakka: co-founder, marketing and community.", "Hassan Saleh Al-Haidose: CTO, founder of Q Madar."]], "ar": ["منو ورا دَدَن؟", ["شيخة الأنصاري: المؤسِّسة، تقود المنتج.", "لينا السقّا: شريكة مؤسِّسة، التسويق والمجتمع.", "حسن صالح الهيدوس: المدير التقني، مؤسس كيو مدار."]]}], "limits": {"en": ["We have not run our own study. We read published research and built on it.", "Dadan has been tested at home only. A pilot with more families comes next.", "None of the studies is about Qatar alone.", "Our market size and our first-year numbers are estimates.", "Our money numbers start from market averages. Our own will come from the pilot."], "ar": ["ما سوينا دراسة بنفسنا. قرينا أبحاث منشورة وبنينا عليها.", "دَدَن تجرّب في البيت بس. الخطوة الجاية تجربة مع عائلات أكثر.", "ولا دراسة من هالدراسات عن قطر بروحها.", "حجم السوق وأرقام السنة الأولى تقديرات.", "أرقام الفلوس تبدأ من متوسطات السوق. أرقامنا احنا بتجي من التجربة."]}, "ui": {"en": {"lang": "عربي", "kicker": "Dadan in depth", "h1": "Every number we say, and where it comes from.", "lead": "Tap a card to open it. Each one shows who did the study, where, and what it does not prove.", "s1": "The numbers", "s2": "Why children come back", "s2lead": "We studied why children love games, and built on t
