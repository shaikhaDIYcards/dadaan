<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>دَدَن</title>
<script>
/* The game is closed until launch. Drop what an earlier visit kept for offline play on this device (the child's
   progress is left alone), then go to the front page. */
(function () {
  var jobs = [];
  try { if ('serviceWorker' in navigator) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })); } catch (e) {}
  try { if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })); } catch (e) {}
  var go = function () { location.replace('../'); };
  var all = window.Promise ? Promise.all(jobs) : null;
  if (all) all.then(go, go); else go();
  setTimeout(go, 1500);
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=../"></noscript>
</head>
<body><p><a href="../">دَدَن</a></p></body>
</html>
