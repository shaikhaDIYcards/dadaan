<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#A5E0F0">
<title>دَدَن</title>
<meta name="description" content="دَدَن. قريباً.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@800&display=swap">
<style>
/* The site is closed until launch, by the owner's choice: the logo and one word. Nothing is linked from here,
   and the game is not reachable (play/ sends visitors back to this page). */
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; min-height: 100svh; display: grid; grid-template-rows: 1fr auto;
  background: linear-gradient(#A5E0F0, #E4F6F8); color: #0A5560; text-align: center;
  font-family: "Baloo Bhaijaan 2", "Segoe UI", Tahoma, system-ui, sans-serif;
}
main { display: grid; place-content: center; justify-items: center; padding: 24px; }
main img { width: min(64vw, 300px); height: auto; }
h1 { margin: 6px 0 0; font-weight: 800; font-size: clamp(36px, 10vw, 54px); line-height: 1.3; }
footer { background: #A5CD57; }
footer img { display: block; width: 100%; max-width: 900px; height: auto; margin: 0 auto; }
</style>
</head>
<body>
<main>
  <img src="a/logo.webp" alt="دَدَن" width="1022" height="634">
  <h1>قريباً</h1>
</main>
<footer><img src="a/beds.webp" alt="" width="1650" height="152"></footer>
</body>
</html>
